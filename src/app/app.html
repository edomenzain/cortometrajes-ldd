<a
  href="#contenido-principal"
  class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:rounded-md focus:bg-primary focus:px-4 focus:py-2 focus:text-primary-content"
>
  Saltar al contenido principal
</a>

<div class="flex min-h-dvh flex-col">
  <header class="sticky top-0 z-40 border-b border-border bg-surface/80 backdrop-blur">
    <nav
      class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6"
      aria-label="Navegación principal"
    >
      <a routerLink="/" class="flex items-center gap-2 text-lg font-semibold text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring rounded-md">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="size-7 shrink-0 text-primary" aria-hidden="true">
          <rect x="2.5" y="5.5" width="19" height="13" rx="2" />
          <path d="M9.5 5.5v13M2.5 9h7M2.5 15h7M14.5 9.5l4 2.5-4 2.5v-5Z" />
        </svg>
        <span>Cortometrajes LDD</span>
      </a>

      <ul class="flex flex-wrap items-center gap-1">
        @for (enlace of enlaces(); track enlace.ruta) {
          <li>
            <a
              [routerLink]="enlace.ruta"
              routerLinkActive
              #rla="routerLinkActive"
              class="block cursor-pointer rounded-md px-3 py-2 text-sm font-medium transition-colors duration-150 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
              [class]="rla.isActive ? 'bg-primary text-primary-content' : 'text-foreground hover:bg-muted'"
            >
              {{ enlace.etiqueta }}
            </a>
          </li>
        }
      </ul>

      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="tema.alternar()"
          [attr.aria-pressed]="tema.tema() === 'oscuro'"
          [attr.aria-label]="tema.tema() === 'oscuro' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
          class="flex size-10 cursor-pointer items-center justify-center rounded-md text-foreground transition-colors duration-150 hover:bg-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
        >
          @if (tema.tema() === 'oscuro') {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="size-5" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5" />
              <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="size-5" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" />
            </svg>
          }
        </button>

        @if (auth.usuarioActual(); as usuario) {
          <div class="flex items-center gap-3 rounded-md border border-border py-1.5 pl-3 pr-1.5">
            <div class="text-right leading-tight">
              <p class="text-sm font-medium text-foreground">{{ usuario.nombre }}</p>
              <p class="text-xs text-muted-foreground capitalize">{{ usuario.rol }}</p>
            </div>
            <button
              type="button"
              (click)="cerrarSesion()"
              class="flex h-8 cursor-pointer items-center gap-1.5 rounded-md px-2.5 text-sm font-medium text-foreground transition-colors duration-150 hover:bg-destructive/10 hover:text-destructive focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
            >
              Salir
            </button>
          </div>
        }
      </div>
    </nav>
  </header>

  <main id="contenido-principal" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6">
    <router-outlet />
  </main>

  <footer class="border-t border-border py-6 text-center text-sm text-muted-foreground">
    Herramienta de evaluación de cortometrajes para profesores de diseño.
  </footer>
</div>
